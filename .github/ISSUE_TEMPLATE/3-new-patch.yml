name: New patch
description: Suggest a patch that should be part of this patcher.
title: "[Patch] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your suggestion! English or German is fine.
        **Please do not attach `Wow.exe` or any other Blizzard files.**
  - type: textarea
    id: what
    attributes:
      label: What does the patch do?
    validations:
      required: true
  - type: textarea
    id: origin
    attributes:
      label: Origin and author
      description: Where does the patch come from and who wrote it? Please add a link so the author can be credited correctly.
  - type: textarea
    id: bytes
    attributes:
      label: Addresses and bytes
      description: File offsets or addresses with original and new bytes, or a link to the code.
      render: text
  - type: dropdown
    id: tested
    attributes:
      label: Tested?
      options:
        - Tested in game on a private server
        - Tested in game on a public server
        - Not tested yet
  - type: textarea
    id: risk
    attributes:
      label: Ban risk or server requirements
      description: Can servers detect it? Does the server have to support it?
  - type: checkboxes
    id: permission
    attributes:
      label: Permission
      options:
        - label: I am the author of this patch.
        - label: The author agrees that the patch is included.
